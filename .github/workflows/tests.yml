# The Python suite on the Python floor (3.9, macOS's own python3; docs/STANDARDS.md section 4) and a current one:
# no Forge build, no API key, a read-only token. The full gate is acceptance (section 1).
# On every PR and push to main.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}  # pinned images: the newest one no longer serves 3.9
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python-version: "3.9"}
          - {os: ubuntu-24.04, python-version: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The grader tests compile with `javac --release 17`; ubuntu-22.04's own javac is 11 ("release version 17 not
      # supported", run 42760238737).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: unit tests
        run: python3 -m unittest discover -s eval/tests -p 'test_*.py'
